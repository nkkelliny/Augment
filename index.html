<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Augment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="Augment_logo.png">
    <!-- Monaco Editor via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.48.0/min/vs/loader.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-header">
        <img src="assets/logo/augment-logo.svg" alt="Augment logo" class="logo" />
        <span class="title">Augment</span>
      </div>
    <div id="top-bar">
        <div class="left">
            <button id="btn-open-file">Open File</button>
            <button id="btn-open-folder">Open Folder</button>
            <button id="btn-save">Save</button>
            <button id="btn-save-as">Save As</button>
            <button id="btn-new-file">New File</button>
            <span id="file-label">No file open</span>
        </div>
        <div class="right">
            <select id="language-select">
                <option value="auto" selected>Auto Detect</option>
                <option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="csharp">C#</option>
                <option value="json">JSON</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="python">Python</option>
                <option value="plaintext">Plain Text</option>
            </select>
        </div>
    </div>

    <div id="main-container">
        <!-- Sidebar / File Explorer -->
        <div id="sidebar">
            <div id="sidebar-header">
                <span>EXPLORER</span>
            </div>
            <div id="folder-info">
                <div id="folder-label">No folder open</div>
                <div id="folder-actions">
                    <button id="btn-new-folder">New Folder</button>

                    <!-- Inline new folder form -->
                    <div id="new-folder-form" class="hidden">
                        <input id="new-folder-name" type="text" placeholder="Folder name" />
                        <button id="btn-create-folder-confirm">Create</button>
                        <button id="btn-create-folder-cancel">Cancel</button>
                    </div>
                </div>
            </div>
            <div id="file-tree"></div>
        </div>

        <!-- Center: Tabs + Editor -->
        <div id="center-column">
            <div id="tab-bar"></div>
            <div id="editor-container"></div>
        </div>

        <!-- AI Panel -->
        <div id="ai-panel">
            <div id="ai-header">
                <div>
                    <h3>AI Assistant</h3>
                    <small>Ollama local model</small>
                </div>
                <div class="ai-model-row">
                    <label for="model-input">Model</label>
                    <input id="model-input" type="text" value="llama3.2" />
                </div>
            </div>

            <div id="ai-messages"></div>

            <div id="ai-tools">
                <button id="btn-explain-selection">Explain Selection</button>
                <button id="btn-refactor-selection">Refactor Selection</button>
                <button id="btn-generate-tests">Generate Tests</button>
            </div>

            <div id="ai-input-area">
                <textarea id="ai-input" rows="3" placeholder="Ask the AI anything about your code or project..."></textarea>
                <div class="ai-buttons">
                    <button id="btn-ask-ai">Ask AI</button>
                    <button id="btn-ask-ai-about-file">Ask About Current File</button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
